name: E2E - Cadastro Blocks

#Roda a cada push na main, em pull requests e manualmente (aba Actions > Run workflow).
#Sem execução agendada de propósito: cada execução cria contas no ambiente da Blocks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite-principal:
    name: Suíte principal (npm test)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #instala as dependências (npm ci) com cache do npm e do binário do Cypress, e roda a suíte;
      #no CI cada teste tem 1 nova tentativa para absorver instabilidade de rede do site
      - name: Rodar a suíte principal
        uses: cypress-io/github-action@v6
        with:
          command: npm test -- --config retries=1

      - name: Guardar relatório e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-suite-principal
          path: |
            cypress/reports
            cypress/screenshots
          retention-days: 14

  testes-idioma:
    #Os testes de idioma validam o comportamento esperado e hoje falham de propósito
    #(cada falha é um bug registrado no relatório). continue-on-error evita que essas
    #falhas conhecidas marquem o workflow como quebrado.
    name: Testes de idioma (falhas esperadas = bugs registrados)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar os testes de idioma
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:idiomas

      - name: Guardar relatório e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-idioma
          path: |
            cypress/reports
            cypress/screenshots
          retention-days: 14
